version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex123
      POSTGRES_DB: cortex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_URL=postgresql://cortex:cortex123@postgres:5432/cortex
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - model_cache:/root/.cache

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  model_cache:
